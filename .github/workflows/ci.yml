name: Branch checks

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build static site
        run: npm run build
        env:
          PUBLIC_FIREBASE_API_KEY: test-firebase-web-api-key
          PUBLIC_FIREBASE_AUTH_DOMAIN: project-id.firebaseapp.com
          PUBLIC_FIREBASE_PROJECT_ID: project-id
          PUBLIC_FIREBASE_APP_ID: 1:123456789:web:abcdef
          PUBLIC_SUPABASE_URL: https://example.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: test-supabase-anon-key-not-a-secret
